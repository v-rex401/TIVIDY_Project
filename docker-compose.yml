services:
  tividy:
    build: .
    stdin_open: true
    tty: true
    # Docker's own TERM=xterm makes FTXUI fall back to 16 colours, so pass the host terminal's settings through
    environment:
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-}
  tests:
    build: .
    command: make test
