name: Valgrind

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        continue-on-error: true #This is temporary until we have a skeleton
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Compile with debug info
        continue-on-error: true #This is temporary until we have a skeleton
        run: g++ -std=c++11 -g -Iinclude -o main $(find src -name '*.cpp')

      - name: Run under Valgrind
        continue-on-error: true #This is temporary until we have a skeleton
        run: valgrind --leak-check=full --error-exitcode=1 ./main < /dev/null
